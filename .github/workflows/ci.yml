name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rootpilot
          POSTGRES_PASSWORD: rootpilot
          POSTGRES_DB: rootpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootpilot -d rootpilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: rootpilot
      POSTGRES_PASSWORD: rootpilot
      POSTGRES_DB: rootpilot_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      OPENAI_API_KEY: test-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_ANALYSIS_MODEL: gpt-5.6-sol
      RUN_POSTGRES_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check migration drift
        run: uv run alembic check

      - name: Run test suite
        run: uv run pytest

      - name: Check whitespace errors
        run: git diff --check
