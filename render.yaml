previews:
  generation: off

services:
  - type: web
    name: rootpilot-api
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'alembic upgrade head &&
      exec uvicorn apps.metadata_service.main:app
      --host 0.0.0.0
      --port $PORT
      --no-access-log'
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: rootpilot-free-runtime
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false

envVarGroups:
  - name: rootpilot-free-runtime
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_HOSTS
        value: '["*.onrender.com","localhost","127.0.0.1"]'
      - key: DOCS_ENABLED
        value: "false"
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        sync: false
      - key: OPENAI_ANALYSIS_MODEL
        sync: false
      - key: OPENAI_ANALYSIS_API
        value: chat_completions
      - key: OPENAI_TIMEOUT_SECONDS
        value: "60"
      - key: OPENAI_MAX_RETRIES
        value: "2"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: rootpilot-production
      - key: LANGSMITH_HIDE_INPUTS
        value: "false"
      - key: LANGSMITH_HIDE_OUTPUTS
        value: "false"
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_JWT_ALGORITHM
        value: HS256
      - key: AUTH_JWT_ISSUER
        value: rootpilot-render
      - key: AUTH_JWT_AUDIENCE
        value: rootpilot-api
      - key: RETRIEVAL_BACKEND
        value: postgres
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: DEFAULT_RETRIEVAL_LIMIT
        value: "3"
      - key: DEFAULT_MINIMUM_RELEVANCE_SCORE
        value: "0.0"
      - key: INVESTIGATION_MODE
        value: react
      - key: REACT_MAX_ITERATIONS
        value: "8"
      - key: REACT_MAX_TOOL_CALLS
        value: "10"
      - key: REACT_NO_PROGRESS_LIMIT
        value: "2"
      - key: REACT_MAX_TOOL_ERRORS
        value: "3"
      - key: REACT_MAX_RUNTIME_SECONDS
        value: "180"
      - key: REACT_MAX_CONTEXT_SECTIONS
        value: "10"
      - key: REACT_MIN_EVIDENCE_ITEMS
        value: "2"
      - key: REACT_MAX_REPAIR_ATTEMPTS
        value: "2"
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_POOL_RECYCLE_SECONDS
        value: "300"
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: WORKER_LEASE_SECONDS
        value: "300"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: EMBEDDED_WORKER_ENABLED
        value: "true"
