apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rootpilot-api
  namespace: rootpilot
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.rootpilot.example.com
      secretName: rootpilot-api-tls
  rules:
    - host: api.rootpilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rootpilot-api
                port:
                  name: http
