apiVersion: v1
kind: ConfigMap
metadata:
  name: rootpilot-config
  namespace: rootpilot
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  ALLOWED_HOSTS: '["api.rootpilot.example.com","rootpilot-api","localhost","127.0.0.1"]'
  CORS_ORIGINS: '["https://rootpilot.example.com"]'
  DOCS_ENABLED: "false"
  POSTGRES_USER: rootpilot
  POSTGRES_DB: rootpilot
  POSTGRES_HOST: postgres.example.internal
  POSTGRES_PORT: "5432"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"
  DATABASE_POOL_TIMEOUT_SECONDS: "30"
  DATABASE_POOL_RECYCLE_SECONDS: "1800"
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  OPENAI_ANALYSIS_MODEL: gpt-5.6-sol
  OPENAI_TIMEOUT_SECONDS: "60"
  OPENAI_MAX_RETRIES: "2"
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: rootpilot-production
  LANGSMITH_HIDE_INPUTS: "false"
  LANGSMITH_HIDE_OUTPUTS: "false"
  AUTH_ENABLED: "true"
  AUTH_JWT_ALGORITHM: HS256
  AUTH_JWT_ISSUER: rootpilot
  AUTH_JWT_AUDIENCE: rootpilot-api
  RETRIEVAL_BACKEND: postgres
  EMBEDDING_DIMENSIONS: "1536"
  DEFAULT_RETRIEVAL_LIMIT: "3"
  DEFAULT_MINIMUM_RELEVANCE_SCORE: "0.0"
  INVESTIGATION_MODE: react
  REACT_MAX_ITERATIONS: "8"
  REACT_MAX_TOOL_CALLS: "10"
  REACT_NO_PROGRESS_LIMIT: "2"
  REACT_MAX_TOOL_ERRORS: "3"
  REACT_MAX_RUNTIME_SECONDS: "180"
  REACT_MAX_CONTEXT_SECTIONS: "10"
  REACT_MIN_EVIDENCE_ITEMS: "2"
  REACT_MAX_REPAIR_ATTEMPTS: "2"
  WORKER_POLL_INTERVAL_SECONDS: "2"
  WORKER_LEASE_SECONDS: "300"
  WORKER_MAX_ATTEMPTS: "3"
