apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootpilot-api
  namespace: rootpilot
  labels:
    app.kubernetes.io/name: rootpilot
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rootpilot
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rootpilot
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/rootpilot:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rootpilot-config
            - secretRef:
                name: rootpilot-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              httpHeaders:
                - name: Host
                  value: rootpilot-api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: rootpilot-api
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rootpilot-api
  namespace: rootpilot
spec:
  selector:
    app.kubernetes.io/name: rootpilot
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
