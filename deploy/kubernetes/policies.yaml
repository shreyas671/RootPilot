apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rootpilot-api
  namespace: rootpilot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rootpilot
      app.kubernetes.io/component: api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rootpilot-default-deny-ingress
  namespace: rootpilot
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rootpilot-api-ingress
  namespace: rootpilot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rootpilot
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
