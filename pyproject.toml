[project]
name = "rootpilot"
version = "0.1.0"
description = "Evidence-grounded incident investigation with RAG, human review, and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a migrated PostgreSQL database",
]
